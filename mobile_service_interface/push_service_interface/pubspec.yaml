name: push_service_interface
description: Remote push service interface
version: 0.1.3
publish_to: none

environment:
  sdk: ">=2.18.0 <4.0.0"

repository_url: &repository_url https://github.com/mIwr/mobile_service
repository_ref: &repository_ref master
base_service_path: &base_service_path mobile_service_interface/base_service_interface

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.1.2 # Android background and 'killed' push messages callback handler support # Last 3.3.0 version - 2.2.3
  universal_platform: ^1.1.0
  base_service_interface:
    git:
      url: *repository_url
      ref: *repository_ref
      path: *base_service_path

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
